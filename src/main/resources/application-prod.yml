spring:
  datasource:
    # Por defecto en Azure se guarda en /home/data para persistencia (H2)
    url: jdbc:h2:file:/home/data/alertasdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    # Descomenta abajo para usar PostgreSQL real
    # url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alertas_db}
    # username: ${DB_USER:postgres}
    # password: ${DB_PASS:postgres}
    # driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${WEBSITES_PORT:8080}

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"
